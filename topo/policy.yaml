# Canonical groups and upstream URL mappings. Rule contents are maintained upstream.
# Private credentials are assembled by Sub-Store.
schema: topo-policy/v1
status: active
layout: native-upstream-v5
date: '2026-11-17'
sources:
  flowercloud:
    role: primary
    region_eligible: true
    low_cost_marker: 实验性
    multiplier_authority: airport-documentation
  bwh:
    role: self-hosted
    region_eligible: false
  ora:
    role: self-hosted
    region_eligible: false
  pages:
    role: cf-backup
    region_eligible: false
  pages-copy8708:
    role: residential-chain
    region_eligible: false
    platforms:
    - Mihomo
    front_group: ⚡ CF 前置
selectors:
  main:
    name: 🚀 主力出口
    default: airport-low
    choices:
    - airport-low
    - self-hosted
    - airport-all
    - cf-backup
    - home-chain
    automatic_cross_source_fallback: false
  airport-low:
    name: 🌸 花云低倍
    filter:
      source: flowercloud
      low_cost: true
    selection: manual-with-optional-auto-child
    initial_preference: preserve-current-else-hong-kong-low
  self-hosted:
    name: 🏠 自建节点
    filter:
      sources:
      - bwh
      - ora
    initial_preference: bwh-reality-vision
    incompatible_nodes: report-and-omit-only-in-unsupported-target
  airport-all:
    name: 🌸 花云全量
    filter:
      source: flowercloud
    selection: manual-with-optional-auto-child
  cf-backup:
    name: ☁️ CF 备用
    filter:
      source: pages
    selection: explicit-manual-with-optional-auto-child
  home-chain:
    name: 🏡 家宽链式
    filter:
      source: pages-copy8708
      type: openvpn
    platforms:
    - Mihomo
    selection: manual
    front_group: ⚡ CF 前置
chain_front:
  name: ⚡ CF 前置
  default: cf-backup
  choices:
  - airport-low
  - self-hosted
  - airport-all
  - cf-backup
  platforms:
  - Mihomo
regions:
  sole_source: flowercloud
  required:
  - US
  - HK
  - JP
  - SG
  - TR
  optional:
  - TW
  - KR
  default_selection: manual-low-cost-first
  optional_auto_child:
    interval_seconds: 600
    tolerance_ms: 80
    test_while_idle: false
  missing_region: report-no-cross-source-or-country-substitution
  classify_from: source-metadata-and-explicit-airport-name-mapping
  classify_from_emoji_alone: false
business_groups:
  ai:
    name: 🤖 AI 服务
    default: region-US
    choices:
    - region-US
    - region-JP
    - region-SG
    - region-HK
    - region-TR
    - main
    - self-hosted
    - home-chain
    - cf-backup
    - DIRECT
  google:
    name: 🌐 谷歌服务
    default: main
    choices:
    - main
    - airport-low
    - airport-all
    - self-hosted
    - home-chain
    - cf-backup
    - region-HK
    - region-JP
    - region-SG
    - region-US
    - region-TR
    - DIRECT
  microsoft:
    name: Ⓜ️ 微软服务
    default: DIRECT
    choices:
    - DIRECT
    - main
    - self-hosted
    - home-chain
    - region-HK
    - region-JP
    - region-SG
    - region-US
    - region-TR
  onedrive:
    name: ☁️ 微软云盘
    default: DIRECT
    choices:
    - DIRECT
    - main
    - self-hosted
    - home-chain
    - region-HK
    - region-JP
    - region-SG
    - region-US
    - region-TR
  apple:
    name: 🍎 苹果服务
    default: DIRECT
    choices:
    - DIRECT
    - main
    - self-hosted
    - home-chain
    - region-HK
    - region-JP
    - region-SG
    - region-US
    - region-TR
  telegram:
    name: 📨 电报
    default: main
    choices:
    - main
    - airport-low
    - airport-all
    - self-hosted
    - home-chain
    - cf-backup
    - region-HK
    - region-JP
    - region-SG
    - region-US
    - region-TR
    - DIRECT
  crypto:
    name: ₿ 加密货币
    default: main
    choices:
    - main
    - airport-low
    - airport-all
    - self-hosted
    - home-chain
    - cf-backup
    - region-HK
    - region-JP
    - region-SG
    - region-US
    - region-TR
    - DIRECT
routing:
  order:
  - bootstrap
  - flowercloud-direct
  - ads
  - oracle
  - ai
  - telegram
  - crypto
  - onedrive
  - microsoft
  - apple
  - google
  - cn-domains
  - cn-ip
  - final
  domestic: DIRECT
  final: main
  gemini: ai
  copilot: ai
  shared_google_login_and_generic_api: google
  upstream_process_matches: native-client-specific
  source_equivalence: same-upstream-families-with-native-client-matching
ads:
  default_mode: enabled
  default_sources:
  - anti-AD
  - AWAvenue
  optional_enhanced_sources:
  - AdRules
  - AWAvenue
  merge: upstream-lists-used-directly
  external_adblocking_dns: false
  pause_preserves_normal_business_routing: true
  mihomo_pause: REJECT-to-PASS-verified
  qx_pause:
    mechanism: manual-filter-and-rewrite-resource-toggles
    rewrite_control: native-qx-resource-switches
    disable_global_mitm: false
    ad_filter_tags:
    - 广告 · anti-AD
    - 广告 · 秋风
  external_browser_extensions_in_pause_scope: false
qx:
  server_remote_count: 1
  server_remote_authority: Sub-Store-collection-all
  remove_disabled_legacy_node_subscriptions: true
  mitm_certificate_storage: private-device-or-private-handoff-only
  rewrite_modules:
    travel-replay:
      enabled: false
      category: owner-functional
      preserve_source_and_options: true
      tag: 旅行串串 · 下载重放
      legacy_tags:
      - 旅行串串下载重放
    travel-record:
      enabled: false
      category: owner-functional
      preserve_source_and_options: true
      tag: 旅行串串 · 下载记录
      legacy_tags:
      - 旅行串串下载记录
    travel-modify:
      enabled: true
      category: owner-functional
      preserve_source_and_options: true
      tag: 旅行串串 · 下载修改
      legacy_tags:
      - 旅行串串下载修改
    travel-check:
      enabled: false
      category: owner-functional
      preserve_source_and_options: true
      tag: 旅行串串 · 检查
      legacy_tags:
      - 旅行串串检查
    flightradar24:
      keep: true
      category: functional
      tag: Flightradar24 · 会员解锁
      legacy_tags:
      - Flightradar24会员解锁@ddgksf2013
    umetrip:
      keep: true
      category: ads
      membership_effect: not-verified
      tag: 航旅纵横 · 去广告
      legacy_tags:
      - 航旅纵横
    bilibili-lite:
      keep: true
      category: ads
      tag: 哔哩哔哩 · 净化精简
      legacy_tags:
      - 哔哩哔哩净化精简
    amap:
      keep: true
      category: ads
      tag: 高德地图 · 去广告
      legacy_tags:
      - 高德地图广告
    baidu-map:
      keep: true
      category: ads
      tag: 百度地图 · 去广告
      legacy_tags:
      - 百度地图
      opt_parser: true
    weibo-light:
      keep: true
      category: ads
      app_variant: user-confirmed-light
      tag: 微博轻享版 · 去广告
      legacy_tags:
      - 微博轻享版
    startup-ads:
      keep: true
      category: ads
      tag: 通用应用 · 去开屏
      legacy_tags:
      - 墨鱼去开屏
      url: https://ddgksf2013.top/rewrite/StartUpAds.conf
      opt_parser: false
      update_interval: 86400
    wechat-miniapp:
      keep: true
      category: ads
      tag: 微信小程序 · 去广告
      legacy_tags:
      - 微信小程序去广告@ddgksf2013
    wechat-unblock-links:
      keep: true
      category: functional
      tag: 微信 · 解除链接屏蔽
      legacy_tags:
      - 微信解锁被屏蔽的URL@zZPiglet
      url: https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/Function/UnblockURLinWeChat.conf
      opt_parser: false
      update_interval: 86400
      img_url: https://github.com/Koolson/Qure/raw/master/IconSet/mini/WeChat.png
    youtube-ads:
      keep: true
      category: ads
      tag: YouTube · 去广告
      legacy_tags:
      - 油管去广告@Maasea
    xiaohongshu:
      tag: 小红书 · 净化与去水印
      legacy_tags:
      - 小红书净化+去水印@ddgksf2013
      url: https://ddgksf2013.top/rewrite/XiaoHongShuAds.conf
      img_url: https://github.com/ddgksf2013/Icon/raw/master/qx/xiaohongshu.png
      opt_parser: false
      category: ads
      mixed_functionality: true
      enabled: true
      update_interval: 86400
    baidupan-ads:
      tag: 百度网盘 · 净化
      legacy_tags:
      - 百度网盘净化@ddgksf2013
      url: https://ddgksf2013.top/scripts/bdpan.ads.js
      img_url: https://github.com/ddgksf2013/Icon/raw/master/qx/baiduwangpan.png
      opt_parser: true
      category: ads
      enabled: true
      update_interval: 86400
    baidupan-speed:
      tag: 百度网盘 · 倍速
      legacy_tags:
      - 百度网盘倍速@ddgksf2013
      url: https://ddgksf2013.top/scripts/bdpan.unlock.js
      img_url: https://github.com/ddgksf2013/Icon/raw/master/qx/baiduwangpan.png
      opt_parser: true
      category: functional
      enabled: true
      update_interval: 86400
    spotify:
      tag: Spotify · 去广告与播放增强
      legacy_tags: []
      url: https://raw.githubusercontent.com/app2smile/rules/master/module/spotify.conf
      opt_parser: false
      category: ads
      mixed_functionality: true
      enabled: true
      update_interval: 86400
    railway12306:
      tag: 铁路12306 · 去广告
      legacy_tags: []
      url: https://raw.githubusercontent.com/ddgksf2013/Scripts/master/12306.js
      opt_parser: true
      category: ads
      enabled: true
      update_interval: 86400
    netease:
      tag: 网易云音乐 · 净化
      legacy_tags: []
      url: https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/NeteaseAds.conf
      opt_parser: false
      category: ads
      enabled: true
      update_interval: 86400
    china-unicom:
      tag: 中国联通 · 净化
      legacy_tags: []
      url: https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/ChinaUnicomAds.conf
      opt_parser: false
      category: ads
      enabled: true
      update_interval: 86400
    iringo-weatherkit:
      tag: 苹果天气 · WeatherKit 增强
      legacy_tags: []
      url: https://github.com/NSRingo/WeatherKit/releases/latest/download/iRingo.WeatherKit.snippet
      opt_parser: false
      category: functional
      enabled: true
      update_interval: 86400
  other_legacy_modules: archive-not-enabled-in-new-profile
  boxjs: include-only-if-selected-modules-require-it
  policy_icon_base: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/
  policy_icons:
    main: Proxy.png
    airport-low: Airport.png
    self-hosted: Server.png
    airport-all: Global.png
    cf-backup: Cloudflare.png
    region-US: United_States.png
    region-HK: Hong_Kong.png
    region-JP: Japan.png
    region-SG: Singapore.png
    region-TR: Turkey.png
    region-TW: Taiwan.png
    region-KR: Korea.png
    airport-auto: Auto.png
    cf-auto: Auto.png
    ai: AI.png
    google: Google.png
    microsoft: Microsoft.png
    onedrive: OneDrive.png
    apple: Apple.png
    telegram: Telegram.png
    crypto: Cryptocurrency.png
  rewrite_transport: direct-upstream
  rewrite_overlap_handling: accept-upstream-overlaps
  rewrite_requirements:
    udp_drop_ports:
    - 443
    direct_hosts:
    - ad.12306.cn
  filter_remote_count: 14
  filter_remote_authority: direct-upstream-native-formats
  resource_parser_url: https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
publishing:
  auto_check_interval_hours: 24
  reject_empty_or_invalid_updates: true
  retain_last_good: client-managed
  preserve_existing_share_urls_where_possible: true
  deploy_after: source-url-format-and-native-core-verification
  rule_transport: direct-upstream-client-download
  client_rule_refs: upstream-branches
  refresh_location: clients
known_acceptance_boundaries:
- Node-quality-and-app-script-effect-cannot-be-inferred-from-download-or-latency
- Selected-proxy-runtime-state-is-not-synchronized-between-devices
- Shared-HTTPS-hosts-cannot-be-routed-by-request-path-in-Mihomo
- Upstream-client-format-and-matching-differences-are-not-normalized
bootstrap_rules:
- - DOMAIN-SUFFIX
  - sub.stlyx.com
- - DOMAIN-SUFFIX
  - local
- - DOMAIN-SUFFIX
  - lan
- - IP-CIDR
  - 0.0.0.0/8
- - IP-CIDR
  - 10.0.0.0/8
- - IP-CIDR
  - 100.64.0.0/10
- - IP-CIDR
  - 127.0.0.0/8
- - IP-CIDR
  - 169.254.0.0/16
- - IP-CIDR
  - 172.16.0.0/12
- - IP-CIDR
  - 192.168.0.0/16
- - IP-CIDR
  - 224.0.0.0/4
- - IP-CIDR6
  - ::1/128
- - IP-CIDR6
  - fc00::/7
- - IP-CIDR6
  - fe80::/10
